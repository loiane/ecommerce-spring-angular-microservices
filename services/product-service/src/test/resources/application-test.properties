## Test Profile Configuration

## Use H2 in-memory database for fast tests (enable PostgreSQL compatibility MODE to avoid dialect-specific DDL errors)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=test
spring.datasource.password=test

## JPA configuration for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

## Disable actuator endpoints for tests
management.endpoints.access.default=none

## Logging (keep domain debug, suppress noisy SQL/binder logs)
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=warn
logging.level.com.loiane.ecommerce.product=DEBUG
