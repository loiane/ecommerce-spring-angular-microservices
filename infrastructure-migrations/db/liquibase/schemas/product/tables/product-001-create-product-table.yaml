databaseChangeLog:
  - changeSet:
      id: product-001-create-product
      author: loiane
      labels: product,ddl
      context: prod,dev,test
      preConditions:
        onFail: HALT
        onFailMessage: "Schema ${productSchema} missing"
        - sqlCheck:
            expectedResult: 1
            sql: "SELECT COUNT(1) FROM information_schema.schemata WHERE schema_name='${productSchema}'"
      changes:
        - createTable:
            schemaName: ${productSchema}
            tableName: product
            remarks: "Product catalog entries"
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: sku
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(24)
                  defaultValue: 'ACTIVE'
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createIndex:
            schemaName: ${productSchema}
            tableName: product
            indexName: idx_product_sku
            unique: true
            columns:
              - column:
                  name: sku
      rollback:
        - dropTable:
            schemaName: ${productSchema}
            tableName: product
